name: Deploy site

# Every run builds main, plus each open pull request from this repository into pr-preview/pr-<number>/, and deploys
# them together: GitHub Pages serves one site per repository, and only main may deploy to it. A pull request starts
# this file through "PR changed" (pr-changed.yml): when that run finishes, this one runs as it is on main
# (workflow_run), so the preview of a closed PR goes away on the next run. Pull requests from forks get no preview.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [PR changed]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.prs.outputs.pr }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the pages
        run: python3 tools/build.py
      - name: List open pull requests from this repository
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefOid)"' > "$RUNNER_TEMP/prs.txt"
          # The list can lag the pull request that started this run: one opened or pushed seconds ago may be missing
          # or show its previous commit, and one closed seconds ago may still be listed. The pull requests whose head
          # is the commit that started this run are read directly, and decide their own entries.
          if [ -n "$HEAD_SHA" ]; then
            gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[]
              | select(.head.sha == $ENV.HEAD_SHA and .head.repo.full_name == $ENV.GITHUB_REPOSITORY)
              | "\(.number) \(.state)"' > "$RUNNER_TEMP/event.txt"
            while read -r n state; do
              grep -v "^$n " "$RUNNER_TEMP/prs.txt" > "$RUNNER_TEMP/others.txt" || true
              mv "$RUNNER_TEMP/others.txt" "$RUNNER_TEMP/prs.txt"
              if [ "$state" = open ]; then
                echo "$n $HEAD_SHA" >> "$RUNNER_TEMP/prs.txt"
                echo "pr=$n" >> "$GITHUB_OUTPUT"
              fi
            done < "$RUNNER_TEMP/event.txt"
          fi
          cat "$RUNNER_TEMP/prs.txt"
      - name: Build each pull request into pr-preview/
        run: |
          # no token in this step: it runs the PR's own build.py
          while read -r n sha; do
            git fetch -q --depth 1 origin "$sha"
            git worktree add -q --detach "$RUNNER_TEMP/pr-$n" "$sha"
            if (cd "$RUNNER_TEMP/pr-$n" && python3 tools/build.py > /dev/null); then
              mkdir -p site/pr-preview
              cp -R "$RUNNER_TEMP/pr-$n/site" "site/pr-preview/pr-$n"
            else
              echo "::warning::PR #$n did not build, so it has no preview"
            fi
          done < "$RUNNER_TEMP/prs.txt"
          printf 'User-agent: *\nDisallow: /pr-preview/\n' > site/robots.txt
      - name: Serve the files as they are
        run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  comment:
    needs: [build, deploy]
    if: needs.build.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post the preview link once
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.build.outputs.pr }}
          URL: ${{ needs.deploy.outputs.page_url }}pr-preview/pr-${{ needs.build.outputs.pr }}/
        run: |
          posted=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Preview:"))) | .id')
          if [ -z "$posted" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
              --body "Preview: $URL (rebuilt on every push to this PR, removed when it closes)"
          fi
