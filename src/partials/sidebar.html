<div class="side-scrim" id="side-scrim" hidden></div>
<script>
(() => {
  const body = document.body, btn = document.getElementById("side-btn"), scrim = document.getElementById("side-scrim");
  const set = open => { body.classList.toggle("side-open", open); scrim.hidden = !open; if (btn) btn.setAttribute("aria-expanded", String(open)); };
  if (btn) btn.addEventListener("click", () => set(!body.classList.contains("side-open")));
  scrim.addEventListener("click", () => set(false));
  document.addEventListener("keydown", e => { if (e.key === "Escape") set(false); });
  document.querySelectorAll("#side a").forEach(a => a.addEventListener("click", () => set(false)));
})();
</script>
